plugins { id 'com.android.application' }
def releaseKeystore = System.getenv('OPENSLOPE_ANDROID_KEYSTORE')
def releaseStorePassword = System.getenv('OPENSLOPE_ANDROID_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('OPENSLOPE_ANDROID_KEY_ALIAS')
def releaseKeyPassword = System.getenv('OPENSLOPE_ANDROID_KEY_PASSWORD')
def releaseSigningReady = [releaseKeystore, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it }
android {
    namespace 'org.openslope.nativeplayer'
    compileSdk 35
    ndkVersion '28.1.13356709'
    defaultConfig {
        applicationId 'org.openslope.nativeplayer'
        minSdk 29
        targetSdk 35
        versionCode 79
        versionName rootProject.file('../VERSION.txt').text.trim()
        testInstrumentationRunner 'org.openslope.nativeplayer.NativeImportInstrumentation'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments '-DOPENSLOPE_BUILD_PLAYER=ON', '-DOPENSLOPE_BUILD_TESTS=OFF',
                    "-DOPENSLOPE_HOST_SHADER_DIR=${project.findProperty('openslopeHostShaderDir') ?: "${rootDir}/../../temp/native/generated"}"
                targets 'openslope_player'
            }
        }
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            if (releaseSigningReady) { signingConfig signingConfigs.release }
        }
    }
    externalNativeBuild { cmake { path '../../CMakeLists.txt'; version '3.31.6' } }
    sourceSets {
        main { assets.srcDirs = ['../../ThirdPartyNotices', "$buildDir/generated/licenseAssets"] }
        androidTest { assets.srcDirs = ["$buildDir/generated/testAssets"] }
    }
}
tasks.register('prepareLicenseAssets', Copy) {
    from '../../LICENSE', '../../NOTICE'
    from('../../assets/NOTICE.txt') { rename { 'stick-figure-NOTICE.txt' } }
    from('../../../Contracts/NOTICE') { rename { 'shared-contracts-NOTICE.txt' } }
    into "$buildDir/generated/licenseAssets"
}
tasks.named('preBuild').configure { dependsOn 'prepareLicenseAssets' }
tasks.register('requireReleaseSigning') {
    doLast {
        if (!releaseSigningReady) { throw new GradleException('Release signing requires all four OPENSLOPE_ANDROID_* environment variables. See Native/docs/releases.md.') }
        if (!file(releaseKeystore).isFile()) { throw new GradleException('Release keystore file does not exist.') }
    }
}
tasks.configureEach {
    if (name == 'preReleaseBuild') { dependsOn 'requireReleaseSigning' }
}
