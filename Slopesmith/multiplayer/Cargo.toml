# repo-hygiene: allow[config-listing] -- authored Cargo manifest for the multiplayer service
[package]
name = "slopesmith-multiplayer"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
default-run = "slopesmith-multiplayer"

[dependencies]
base64 = "0.22"
bytes = "1"
futures = "0.3"
flate2 = "1"
hmac = "0.12"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
soketto = { version = "0.8", features = ["deflate", "http"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["compat", "rt"] }
ts-rs = "12"

[[bin]]
name = "export-protocol"
path = "src/bin/export-protocol.rs"
