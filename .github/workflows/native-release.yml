name: Native release packages

on:
  workflow_dispatch:
    inputs:
      create_draft:
        description: Create a draft GitHub prerelease after building and checking the packages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-release
  cancel-in-progress: false

jobs:
  packages:
    # Release credentials are used only by a manually selected main-branch build.
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Build signed, checked release packages
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.NATIVE_ANDROID_KEYSTORE_BASE64 }}
          OPENSLOPE_ANDROID_STORE_PASSWORD: ${{ secrets.NATIVE_ANDROID_STORE_PASSWORD }}
          OPENSLOPE_ANDROID_KEY_ALIAS: ${{ secrets.NATIVE_ANDROID_KEY_ALIAS }}
          OPENSLOPE_ANDROID_KEY_PASSWORD: ${{ secrets.NATIVE_ANDROID_KEY_PASSWORD }}
          EXPECTED_CERTIFICATE: ${{ vars.NATIVE_ANDROID_CERT_SHA256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:KEYSTORE_BASE64) { throw 'Configure the four Native Android signing secrets; see Native/docs/releases.md.' }
          $taskKey = Join-Path $env:RUNNER_TEMP 'openslope-native-release.jks'
          $env:OPENSLOPE_ANDROID_KEYSTORE = $taskKey
          try {
            [IO.File]::WriteAllBytes($taskKey, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
            ./Native/release.ps1 -Setup
            $taskVersion = (Get-Content Native/VERSION.txt -Raw).Trim()
            $taskManifest = Get-Content "temp/native-release-artifacts/OpenSlope-Native-$taskVersion/release-manifest.json" -Raw | ConvertFrom-Json
            if ($env:EXPECTED_CERTIFICATE -and $taskManifest.quest.signer_sha256 -ne $env:EXPECTED_CERTIFICATE.ToLowerInvariant()) { throw 'APK certificate differs from the pinned release identity.' }
          } finally {
            Remove-Item -LiteralPath $taskKey -Force -ErrorAction SilentlyContinue
          }
      - name: Save downloadable packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-release-packages
          path: temp/native-release-artifacts/OpenSlope-Native-*/*
          if-no-files-found: error
          retention-days: 14
      - name: Create draft prerelease
        if: inputs.create_draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $taskVersion = (Get-Content Native/VERSION.txt -Raw).Trim()
          $taskDirectory = "temp/native-release-artifacts/OpenSlope-Native-$taskVersion"
          $taskTag = "native-v$taskVersion"
          git ls-remote --exit-code --tags origin "refs/tags/$taskTag"
          if ($LASTEXITCODE -eq 0) { throw 'The version tag already exists; increment the version before releasing.' }
          if ($LASTEXITCODE -ne 2) { throw 'Could not check the remote version tag.' }
          $taskAssets = @(Get-ChildItem -LiteralPath $taskDirectory -File | ForEach-Object { $_.FullName })
          gh release create $taskTag @taskAssets --target $env:GITHUB_SHA --draft --prerelease --title "OpenSlope Native $taskVersion (preview)" --notes-file "$taskDirectory/RELEASE-NOTES.md"
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed; existing releases are never overwritten.' }
