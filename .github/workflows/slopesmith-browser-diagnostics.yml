name: Slopesmith browser diagnostics

on:
  workflow_dispatch:
    inputs:
      only:
        description: Optional test filename or area; leave empty for every browser check
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: slopesmith-browser-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostics:
    name: On-demand browser diagnostics
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out the toolkit and format-library submodule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up .NET 10.0.110
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.110

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: Slopesmith/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Set up Rust 1.99
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0

      - name: Install Slopesmith dependencies
        timeout-minutes: 5
        run: npm ci --prefix Slopesmith

      - name: Build the Snowknife CLI used by browser export checks
        timeout-minutes: 5
        run: dotnet build Snowknife/Snowknife/Snowknife.csproj -c Debug

      - name: Run browser diagnostics
        timeout-minutes: 45
        env:
          DIAGNOSTIC_ONLY: ${{ inputs.only }}
        run: |
          $diagnosticArgs = @('run', 'diagnose:browser')
          if ($env:DIAGNOSTIC_ONLY) {
            $diagnosticArgs += @('--', '--only', $env:DIAGNOSTIC_ONLY)
          }
          & npm @diagnosticArgs
          exit $LASTEXITCODE

      - name: Upload diagnostic results and per-test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slopesmith-browser-diagnostics
          path: Slopesmith/temp/test-run-*
          if-no-files-found: ignore
          retention-days: 7
