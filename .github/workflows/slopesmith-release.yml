name: Package Slopesmith

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full commit on main to package
        required: true
        type: string
      publish:
        description: Sign and publish to the protected Slopesmith release channel
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: slopesmith-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    outputs:
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
      - name: Select an approved source commit
        id: source
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$REVISION" origin/main
          git checkout --detach "$REVISION"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: Slopesmith/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Set up Rust
        run: rustup toolchain install 1.99.0 --profile minimal && rustup default 1.99.0
      - name: Install dependencies and browser
        working-directory: Slopesmith
        run: |
          npm ci
          npx playwright-core install --with-deps chromium
          node --input-type=module -e "import {chromium} from 'playwright-core'; import {appendFileSync} from 'node:fs'; appendFileSync(process.env.GITHUB_ENV, 'SLOPESMITH_CHROMIUM=' + chromium.executablePath() + '\n');"
      - name: Validate source and release transactions
        working-directory: Slopesmith
        run: |
          npm run typecheck
          npm run lint
          npm run release:test
          npm run test:fast
          npm run multiplayer:test
      - name: Build and package
        working-directory: Slopesmith
        env:
          REVISION: ${{ steps.source.outputs.revision }}
        run: |
          npm run build
          npm run multiplayer:build
          npm run release:package -- --revision "$REVISION"
      - name: Exercise the packaged runtime
        working-directory: Slopesmith
        run: |
          python3 - <<'PY'
          import importlib.util, json, pathlib, subprocess
          spec=importlib.util.spec_from_file_location('release', 'deploy/release_manager.py')
          release=importlib.util.module_from_spec(spec); spec.loader.exec_module(release)
          manifest_path=next(pathlib.Path('temp/releases').glob('*.json'))
          manifest=json.loads(manifest_path.read_text())
          destination=pathlib.Path('temp/packaged-smoke').resolve()
          release.unpack(manifest_path.parent/manifest['archive']['name'], manifest, destination)
          subprocess.run([str(destination/'runtime/bin/node'), 'scripts/smoke-release.mjs', str(destination)],check=True)
          PY
      - name: Exercise preflight as the service account against immutable files
        working-directory: Slopesmith
        run: |
          sudo useradd --system --user-group --no-create-home slopesmith
          sudo install -d -m 0755 /opt/slopesmith-ci
          sudo cp -a temp/packaged-smoke /opt/slopesmith-ci/release
          sudo chown -R root:root /opt/slopesmith-ci
          sudo python3 - <<'PY'
          import importlib.util, pathlib
          spec=importlib.util.spec_from_file_location('release', 'deploy/release_manager.py')
          release=importlib.util.module_from_spec(spec); spec.loader.exec_module(release)
          destination=pathlib.Path('/opt/slopesmith-ci/release')
          release.preflight(destination, destination.parent)
          assert not (destination/'workspace').exists()
          release.verify_installed(destination, __import__('json').loads((destination/'release.json').read_text()))
          print('SERVICE-ACCOUNT PREFLIGHT PASS: root-owned release, isolated storage, payload unchanged')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slopesmith-linux-x64
          path: Slopesmith/temp/releases/*
          retention-days: 7

  publish:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: slopesmith-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.revision }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: slopesmith-linux-x64
          path: release-files
      - name: Sign release metadata
        env:
          RELEASE_KEY: ${{ secrets.SLOPESMITH_RELEASE_SIGNING_KEY }}
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess, tempfile
          value=os.environ.get('RELEASE_KEY','')
          if not value: raise SystemExit('Configure SLOPESMITH_RELEASE_SIGNING_KEY in the protected slopesmith-release environment')
          with tempfile.TemporaryDirectory() as directory:
              key=pathlib.Path(directory)/'publisher.key'; key.write_text(value); key.chmod(0o600)
              manifest=next(pathlib.Path('release-files').glob('slopesmith-*.json'))
              subprocess.run(['python3','Slopesmith/deploy/release_manager.py','sign',str(manifest),str(key),'--latest'],check=True)
          PY
      - name: Publish versioned assets and update channel pointer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Keep the repository's Latest release available for Native downloads.
          gh release view slopesmith-channel >/dev/null 2>&1 || gh release create slopesmith-channel --latest=false --title 'Slopesmith release channel' --notes 'Signed, prebuilt Slopesmith Linux releases. Versioned assets are immutable; latest metadata selects the current release.'
          gh release edit slopesmith-channel --latest=false
          gh release upload slopesmith-channel release-files/slopesmith-*
          gh release upload slopesmith-channel release-files/latest-* --clobber
